version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        # postinstall generates Prisma Client for Amplify's Linux build environment.
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        - node scripts/write-amplify-env.mjs
        - npm run build -- --webpack
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
      - .next/cache/**/*
